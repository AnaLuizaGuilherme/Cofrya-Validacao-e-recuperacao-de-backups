name: Testes Cofrya
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
